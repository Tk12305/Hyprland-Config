# ╔══════════════════════════════════════════════════════╗
# ║         HYPRIDLE CONFIG — LUNAR MOUNTAINS            ║
# ╚══════════════════════════════════════════════════════╝

general {
    lock_cmd      = pidof hyprlock || hyprlock   # don't spawn a second hyprlock
    before_sleep_cmd = loginctl lock-session      # lock before suspend
    after_sleep_cmd  = hyprctl dispatch dpms on   # wake displays on resume
    ignore_dbus_inhibit = false
}

# ── 5 min: dim to 10% ───────────────────────────────────────────────
listener {
    timeout  = 300
    on-timeout = brightnessctl -s set 10%         # save current, dim to 10%
    on-resume  = brightnessctl -r                 # restore saved brightness
}

# ── 6 min: turn off displays ─────────────────────────────────────────
listener {
    timeout  = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# ── 7 min: lock screen ───────────────────────────────────────────────
listener {
    timeout  = 420
    on-timeout = loginctl lock-session
}
